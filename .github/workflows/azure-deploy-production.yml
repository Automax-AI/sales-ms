name: Deploy Azure production

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: azure-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_LOCATION: centralus
      AZURE_RESOURCE_GROUP: rg-automax-sales-prod
      AUTOMAX_IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: packages/twenty-apps/internal/automax-sales/.nvmrc
          cache: yarn
          cache-dependency-path: packages/twenty-apps/internal/automax-sales/yarn.lock

      - name: Azure login with GitHub OIDC
        shell: bash
        run: |
          federated_token="$(
            curl \
              --fail \
              --silent \
              --show-error \
              --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
              | jq --raw-output '.value'
          )"

          az login \
            --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --tenant "$AZURE_TENANT_ID" \
            --federated-token "$federated_token" \
            --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Deploy and verify
        run: scripts/azure/deploy.sh
